<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIC Stitcher</title>
    <meta name="description" content="Stitch the Arknights: Endfield AIC factory top view into one full image, entirely in your browser." />
    <!--
      Link preview (Discord, Slack, ...). These must be absolute URLs: the service that
      builds the preview reads this file on its own and never runs the app. Change them
      if the site moves from hikarin-dev.github.io/aic-stitcher.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AIC Stitcher" />
    <meta property="og:title" content="AIC Stitcher" />
    <meta property="og:description" content="Stitch the Arknights: Endfield AIC factory top view into one full image, from a live window, a recording or screenshots. Runs entirely in your browser; nothing is uploaded." />
    <meta property="og:url" content="https://hikarin-dev.github.io/aic-stitcher/" />
    <meta property="og:image" content="https://hikarin-dev.github.io/aic-stitcher/logo.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="96" />
    <meta property="og:image:height" content="87" />
    <meta property="og:image:alt" content="AIC Stitcher logo" />
    <!-- "summary" keeps the logo as a small thumbnail beside the text instead of blowing it up. -->
    <meta name="twitter:card" content="summary" />
    <!-- Accent colour of the preview (the app's yellow). -->
    <meta name="theme-color" content="#f5d020" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
